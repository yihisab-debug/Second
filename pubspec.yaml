name: regist
description: "MiniBank — учебное приложение мобильного банкинга (Flutter + PHP + MySQL)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # запросы к PHP-API
  http: ^1.1.0

  # хранение токена сессии на устройстве (чтобы при запуске спрашивать только PIN)
  shared_preferences: ^2.2.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
